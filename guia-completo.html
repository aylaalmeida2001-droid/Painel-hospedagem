utilize a ducha antes de entrar e deixe seus pertences nas espreguiçadeiras. A profundidade varia: entre sempre pelos degraus e confira a sinalização.","Para manter a água agradável para todos, alimentos, bebidas e recipientes de vidro ficam fora da piscina. Evite correr, saltar ou mergulhar de cabeça. Crianças precisam de supervisão contínua de um adulto responsável. Não entre na água em caso de diarreia. Após 21h, o espaço descansa para o silêncio noturno."],["🔥","Área gourmet e churrasqueira","Todos os dias · 10h às 22h","Reserve o espaço com o anfitrião pelo WhatsApp. Encontre utensílios no armário inferior, use a churrasqueira somente com ventilação adequada e mantenha a bancada livre para preparar os alimentos.","Para segurança de todos, não deixe o fogo sem acompanhamento; mantenha crianças e pets afastados. Não use álcool ou gasolina para acender carvão. Aguarde as brasas esfriarem e siga as orientações do local para descarte. Ao terminar, limpe grelha e bancada e recolha resíduos. Som ambiente baixo até 22h."],["🧖","Sauna e relaxamento","Todos os dias · 9h às 20h · mediante agendamento","Solicite a ativação ao anfitrião. Entre com toalha, sente-se sobre ela, hidrate-se e faça sessões curtas com pausas para resfriamento. Se sentir tontura ou mal-estar, saia imediatamente.","Não utilize sob efeito de álcool. Pessoas grávidas ou com condições médicas devem consultar um profissional de saúde antes do uso. Crianças não devem entrar sem avaliação das regras e supervisão adequadas. Não altere o painel técnico nem coloque essências nos equipamentos."],["🏋️","Academia","Todos os dias · 6h às 22h","Use tênis adequado, ajuste bancos e cargas antes de começar e escolha exercícios compatíveis com sua experiência. Há colchonetes, halteres e bicicleta ergométrica.","Por gentileza, higienize os equipamentos após o uso, devolva os pesos aos suportes e evite soltar cargas no chão. Menores devem seguir as regras de acesso e supervisão do estabelecimento."],["🐾","Espaço pet e jardim","Todos os dias · 7h às 22h","Pets previamente informados na reserva são bem-vindos no jardim sinalizado. Mantenha água disponível e use guia nas áreas compartilhadas.","Recolha os dejetos imediatamente. Evite deixar animais sozinhos, latindo continuamente ou próximos à piscina, sauna e academia. Móveis e camas são destinados às pessoas; use a caminha do pet."],["🛝","Brinquedoteca e espaço família","Todos os dias · 9h às 20h","Há jogos, livros e brinquedos identificados por faixa etária. Devolva cada item à caixa indicada após brincar.","Um adulto responsável deve acompanhar as crianças. Não leve alimentos para o espaço e informe imediatamente qualquer brinquedo danificado."],["🌅","Terraço e mirante","Todos os dias · 6h às 22h","Aproveite o nascer do sol e o pôr do sol nas cadeiras do mirante. Em dias de chuva ou vento forte, prefira as áreas cobertas.","Respeite as proteções e guarda-corpos, não suba nas estruturas e mantenha o volume de conversas e músicas baixo no período noturno."],["🚗","Garagem e circulação","Acesso 24 horas","Utilize a vaga 12, identificada com o nome da hospedagem. O portão é acionado pelo controle entregue no check-in.","Respeite a velocidade de 10 km/h, não bloqueie acessos e mantenha portões fechados após entrar ou sair."]],"equipment":[["❄️","Ar-condicionado","Use o controle identificado no quarto. Ligue em ON/OFF, selecione COOL e ajuste entre 23 °C e 25 °C. Mantenha portas e janelas fechadas durante o funcionamento."],["📺","Smart TV","Pressione POWER, selecione HOME e escolha seu aplicativo. Use sua própria conta de streaming e encerre a sessão antes do check-out."],["☕","Cafeteira","Encha o reservatório com água filtrada até a marca MAX, coloque a cápsula compatível, feche a alavanca e pressione o botão de extração. Aguarde esfriar antes de retirar a cápsula."],["🍳","Cooktop e forno","Confira se a panela está centralizada e siga as marcações dos comandos. Nunca deixe o preparo sem supervisão. Desligue os controles e confira o resfriamento após o uso."],["🧺","Máquina de lavar","Coloque roupas sem ultrapassar a capacidade indicada, adicione sabão no compartimento e selecione o ciclo rápido ou delicado. Não lave itens com areia em excesso."],["🚿","Chuveiro e água quente","Abra o registro gradualmente e ajuste a temperatura com cuidado. Se houver oscilação ou vazamento, interrompa o uso e avise o anfitrião."],["📶","Wi-Fi","Conecte-se à rede fictícia RefugioSereno_5G com a senha demonstrativa FeriasComCalma2026. Evite compartilhar a senha fora do grupo hospedado."]],"rules":["Silêncio e convivência: após 22h, mantenha conversas e música em volume baixo.","Visitantes externos: somente com autorização prévia e dentro da capacidade da reserva.","Fumo: utilize exclusivamente a área externa sinalizada e descarte resíduos com cuidado.","Pets: permitidos apenas quando incluídos e autorizados na reserva; recolha dejetos e use guia nas áreas comuns.","Piscina e áreas molhadas: supervisione crianças, respeite horários e não leve vidro, comida ou bebidas para dentro da água.","Conservação: comunique danos ou problemas assim que percebidos; evite mover móveis entre ambientes.","Resíduos: separe recicláveis e orgânicos nas lixeiras identificadas.","Saída: desligue aparelhos, confira objetos pessoais, feche portas e devolva o controle na caixa indicada."],"tips":["Mercadinho da Vila · 8h–20h (exemplo fictício)","Farmácia Bem-Estar · 8h–22h (exemplo fictício)","Trilha do Mirante · passeio ilustrativo, confirme condições antes de sair","Praia Serena · ponto turístico fictício para demonstração"],"contact":"Atendimento de exemplo · este guia não possui WhatsApp real"};const nav=document.getElementById('nav'),content=document.getElementById('content');const tabs=[['inicio','🏡','Boas-vindas'],['ambientes','🌿','Ambientes'],...(d.equipment.length?[['equipamentos','⚙️','Equipamentos']]:[]),...(d.rules.length?[['regras','📋','Orientações gerais']]:[]),...(d.tips.length?[['regiao','📍','Região']]:[])];const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;':'&quot;',"'":'&#39;'}[c]));const card=(title,body,extra='')=>'<article class="tile"><h3>'+title+'</h3>'+extra+body+'</article>';const sections={inicio:'<h2>Boas-vindas</h2><p>'+e(d.intro)+'</p><div class="cards">'+card('📍 Localização','<p>'+e(d.address)+'</p>')+card('🕒 Chegada e saída','<p>'+e(d.arrival)+'</p>')+(d.equipment.length?card('📶 Wi-Fi','<p><b>'+e(d.wifi)+'</b></p><p id="pass">'+e(d.pass)+'</p><button class="copy" id="copy">Copiar senha</button>'):'')+'</div>',ambientes:'<h2>Ambientes e experiências</h2><p>Como aproveitar cada espaço com segurança, conforto e respeito a todos.</p><div class="cards">'+d.environments.map(a=>card(a[0]+' '+e(a[1]),'<p>'+e(a[3])+'</p><div class="care"><b>Para aproveitar melhor</b><div>'+e(a[4])+'</div></div>','<span class="hours">'+e(a[2])+'</span>')).join('')+'</div>',equipamentos:'<h2>Como usar os equipamentos</h2><p>Orientações simples para você aproveitar a casa com autonomia.</p><div class="cards">'+d.equipment.map(a=>card(a[0]+' '+e(a[1]),'<p>'+e(a[2])+'</p>')).join('')+'</div>',regras:'<h2>Orientações gerais</h2><p>Pequenos cuidados para que todos tenham uma ótima experiência.</p>'+d.rules.map(x=>'<div class="line">'+e(x)+'</div>').join(''),regiao:'<h2>Descubra a região</h2><p>Indicações ilustrativas que podem ser substituídas por estabelecimentos reais.</p>'+d.tips.map(x=>'<div class="line">'+e(x)+'</div>').join('')};tabs.forEach((t,i)=>{const b=document.createElement('button');b.className='tab'+(i===0?' active':'');b.textContent=t[1]+' '+t[2];b.onclick=()=>activate(t[0]);nav.appendChild(b);const section=document.createElement('section');section.className='section'+(i===0?' active':'');section.id='sec-'+t[0];section.innerHTML=sections[t[0]];content.appendChild(section)});function activate(id){document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',tabs[i][0]===id));document.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.id==='sec-'+id));nav.scrollIntoView({behavior:'smooth',block:'start'})}document.addEventListener('click',async ev=>{if(ev.target.id==='copy'){try{await navigator.clipboard.writeText(d.pass);ev.target.textContent='Senha copiada!'}catch{ev.target.textContent='Selecione a senha acima'}}});</script></body></html>
